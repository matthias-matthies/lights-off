schemaVersion: "2"
kind: sandbox
name: dsh
displayName: DeepSeek Harness (headless)
description: >-
  DeepSeek Harness on Node 24, with the implement, pr, code-review and tdd
  skills installed for unattended ticket work. DeepSeek credentials are
  injected by the sbx proxy; the agent sees only the proxy-managed sentinel.
version: "0.1.0"
sourceURL: https://github.com/matthias-matthies/lights-off

# sbx 0.51.0 made the shell agent a v3 kit, which a v2 kit can't extend, so this
# names the image behind it. bash -l is what the shell agent ran.
sandbox:
  image: docker.io/sbx/shell-image:latest
  entrypoint: [bash]
  command:
    default: [-l]

environment:
  variables:
    # The sandbox is already the isolation boundary. dsh's own nested bash
    # sandbox would otherwise block writes outside the workspace and the
    # "ask" approval policy would stall a headless run with no one to answer.
    DSH_PERMISSION_MODE: danger-full-access
    # Never let a missing terminal turn a git or gh prompt into a hang.
    GIT_TERMINAL_PROMPT: "0"
    GH_PROMPT_DISABLED: "1"

credentials:
  - service: deepseek
    description: DeepSeek API key for model inference, injected by the sbx proxy.
    required: true
    apiKey:
      name: DEEPSEEK_API_KEY
      proxyManaged: true
      inject:
        - domain: api.deepseek.com
          header: x-api-key
          format: "%s"
  # The shell kit no longer provides this. A token stored for one sandbox takes
  # precedence, which is how each role gets its own. The kit limits it to these
  # hosts, whatever else its binding approves.
  - service: github
    description: GitHub token for gh and git over HTTPS, injected by the sbx proxy.
    required: true
    apiKey:
      name: GH_TOKEN
      proxyManaged: true
      inject:
        - domain: api.github.com
          scheme: bearer
        - domain: github.com
          scheme: basic
          username: x-access-token
        - domain: raw.githubusercontent.com
          scheme: bearer

permissions:
  network:
    allow:
      # Model inference and web search.
      - api.deepseek.com
      # Kit installation and packages the Implementer may need.
      - nodejs.org
      - registry.npmjs.org
      - "*.npmjs.org"
      - "*.githubusercontent.com"
      - api.github.com
      - raw.githubusercontent.com
      - github.com
      - "*.github.com"
      - ghcr.io
      # Base-image package updates on Ubuntu and Debian images.
      - "*.ubuntu.com"
      - "*.debian.org"

setup:
  install:
    # The shell image ships git, gh, jq and curl. Fail the kit build loudly if
    # a future base image stops doing so, rather than discovering it mid-run.
    - command: |
        set -eu
        for c in git gh jq curl tar gzip; do
          command -v "$c" >/dev/null 2>&1 || {
            echo "dsh kit: required command missing from base image: $c" >&2
            exit 1
          }
        done
      user: "0"
      description: Check the base image's tooling
    # Node 24.9 or later is required. Pin one exact LTS release; arm64 and
    # amd64 are both published.
    - command: |
        set -eu
        arch="$(uname -m)"
        case "$arch" in
          aarch64|arm64) node_arch=arm64 ;;
          x86_64|amd64) node_arch=x64 ;;
          *) echo "dsh kit: unsupported architecture: $arch" >&2; exit 1 ;;
        esac
        url="https://nodejs.org/dist/v24.22.2/node-v24.22.2-linux-${node_arch}.tar.gz"
        curl -fsSL --retry 3 "$url" -o /tmp/node.tar.gz
        tar -xzf /tmp/node.tar.gz -C /usr/local --strip-components=1
        rm -f /tmp/node.tar.gz
        node --version
      user: "0"
      description: Install Node 24.22.2
    # Pin the dsh release. Its postinstall scripts are optional for the
    # headless profile (verified in the spike); skipping them keeps the build
    # from needing a compiler or a second network round trip.
    - command: |
        set -eu
        npm install -g --prefix /usr/local --ignore-scripts \
          @deepseek-ai/dsh@0.2.2-rc.1
        installed="$(dsh --version)"
        [ "$installed" = "0.2.2-rc.1" ] || {
          echo "dsh kit: expected dsh 0.2.2-rc.1, got $installed" >&2
          exit 1
        }
      user: "0"
      description: Install dsh 0.2.2-rc.1
